<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/><stop offset=".55" stop-color="#0c1322"/><stop offset="1" stop-color="#052b4a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16e0ff"/><stop offset="1" stop-color="#ff3df5"/>
    </linearGradient>
    <radialGradient id="cyan" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#c9fbff"/><stop offset=".35" stop-color="#16e0ff"/><stop offset="1" stop-color="#0a5e8c"/>
    </radialGradient>
    <radialGradient id="mag" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#ffd9fd"/><stop offset=".35" stop-color="#ff3df5"/><stop offset="1" stop-color="#7a0a70"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <!-- 背景（フルブリード・角丸なし: マスカブルもOK） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ネオン縁 -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#rim)" stroke-width="16" filter="url(#glow)"/>
  <!-- 盤グリッド（薄くポップに） -->
  <g stroke="#2a4a7a" stroke-width="4" opacity=".5">
    <path d="M160 128v256M256 128v256M352 128v256M128 160h256M128 256h256M128 352h256"/>
  </g>
  <!-- 発光バック -->
  <circle cx="212" cy="212" r="96" fill="#16e0ff" opacity=".35" filter="url(#soft)"/>
  <circle cx="320" cy="316" r="96" fill="#ff3df5" opacity=".35" filter="url(#soft)"/>
  <!-- 白→めくれてシアンになる石（対角配置・大きめ） -->
  <g filter="url(#glow)">
    <circle cx="212" cy="212" r="104" fill="url(#mag)" stroke="#ffd9fd" stroke-width="8"/>
    <circle cx="320" cy="316" r="104" fill="url(#cyan)" stroke="#c9fbff" stroke-width="8"/>
  </g>
  <!-- めくり弧（回転モーション） -->
  <path d="M366 152a148 148 0 0 0 -112 -44" fill="none" stroke="#7df9ff" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M146 360a148 148 0 0 0 112 44" fill="none" stroke="#ff9df2" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- キラキラ -->
  <g fill="#ffe9a8" filter="url(#glow)">
    <path d="M110 116l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M404 396l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
    <circle cx="420" cy="118" r="9"/>
    <circle cx="96" cy="402" r="9"/>
  </g>
</svg>
